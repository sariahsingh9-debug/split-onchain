name: SPLIT production monitoring
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: split-production-monitoring
  cancel-in-progress: false
jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Wake service and verify automatic recovery
        env:
          APP_BASE_URL: https://split-onchain.onrender.com
        run: node scripts/check-uptime.mjs
